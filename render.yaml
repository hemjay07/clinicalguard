# Render blueprint for the ClinicalGuard backend (FastAPI).
# Free web-service tier. Secrets (sync:false) are set in the Render dashboard.
services:
  - type: web
    name: clinicalguard-api
    runtime: python
    plan: free
    buildCommand: "pip install ."
    startCommand: "uvicorn clinicalguard.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
