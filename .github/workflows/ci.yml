name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installs from pyproject rather than a hand-listed set. The hand-listed
      # one drifted out of date (it was still installing bcrypt and itsdangerous
      # for the auth scheme ADR-031 replaced, while missing pyjwt, pyyaml and
      # alembic), which is a class of breakage that only shows up in CI.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SESSION_SECRET_KEY: ${{ secrets.SESSION_SECRET_KEY }}
          # Not a secret: this is the project's public URL, the same one the
          # frontend bundle ships. It's here because Settings requires it, so
          # without it every test errors during collection.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://sgkyiistoezuvsdfwzqg.supabase.co' }}
        run: |
          pytest tests/ -v
