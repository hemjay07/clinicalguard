# Nixpacks build config for the Railway backend deploy.
# The project uses a PEP 621 pyproject (hatchling). Install the package and its
# runtime dependencies explicitly so the API and its imports are available.
[phases.setup]
nixPkgs = ["python311", "gcc"]

[phases.install]
cmds = ["python -m pip install --upgrade pip", "pip install ."]

[start]
cmd = "uvicorn clinicalguard.api.main:app --host 0.0.0.0 --port $PORT"
