<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The tab title is a wayfinding tool, not a label: physicians author in
         gaps between clinics, with this tab sitting among a dozen others, and
         "MD Authoring" was internal jargon that told them nothing. The compose
         screen replaces this with the condition being written (see Authoring.tsx). -->
    <title>ClinicalGuard</title>
    <meta name="description" content="Physicians write a clinical question, then the marking scheme for the ideal answer, to test whether medical AI follows the Nigerian Standard Treatment Guidelines." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1F4D3F" />

    <!-- Recruitment happens by sharing a link over WhatsApp, where a bare URL
         previews as a suspicious string. These make it preview as what it is. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClinicalGuard" />
    <meta property="og:title" content="Help test whether medical AI is safe to trust." />
    <meta property="og:description" content="Physicians write a clinical question, then the marking scheme for the ideal answer: what a good response must include, and what it must never get wrong." />
    <meta property="og:image" content="https://clinicalguard.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://clinicalguard.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Help test whether medical AI is safe to trust." />
    <meta name="twitter:description" content="Physicians write a clinical question, then the marking scheme for the ideal answer: what a good response must include, and what it must never get wrong." />
    <meta name="twitter:image" content="https://clinicalguard.vercel.app/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
